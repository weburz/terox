allowBuilds:
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
# Lift transitive dependencies past published advisories, staying inside each
# package's current major (or 0.x minor) so no parent sees an API change.
overrides:
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  browserslist@>=4.0.0 <4.28.7: ^4.28.7
  esbuild@>=0.28.0 <0.28.1: ^0.28.1
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  nanoid@>=3.0.0 <3.3.18: ^3.3.18
  postcss@>=8.0.0 <8.5.23: ^8.5.23
  postcss-selector-parser@>=7.0.0 <7.1.6: ^7.1.6
  ws@>=8.0.0 <8.21.0: ^8.21.0
